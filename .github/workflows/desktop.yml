name: Desktop bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m pip install pyinstaller==6.16.0
      - run: python scripts/build_desktop.py --output desktop-output --work desktop-work
      - uses: actions/upload-artifact@v4
        with:
          name: Mnemos-${{ matrix.os }}
          path: |
            desktop-output/*.zip
            desktop-output/*.dmg
# Builds are unsigned developer artifacts. This workflow does not publish releases.
